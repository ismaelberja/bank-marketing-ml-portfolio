[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-marketing-ml-portfolio"
version = "1.0.0"
description = "Leakage-aware, time-ordered binary classification and campaign simulation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.5,<2",
  "matplotlib>=3.8,<4",
  "joblib>=1.3,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.7,<1"]

[tool.setuptools.packages.find]
include = ["bankml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
