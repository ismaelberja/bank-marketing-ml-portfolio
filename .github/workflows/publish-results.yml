name: Train models and publish verified UCI results
on:
  push:
    paths:
      - '.github/workflows/publish-results.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install and test
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q
      - name: Download source directly from UCI
        run: python -m bankml.download
      - name: Train, evaluate and generate results
        run: python -m bankml.train --data data/raw/bank-additional-full.csv --output reports/published
      - name: Commit only aggregate results and figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/published/RESULTS.md reports/published/experiment.json reports/published/figures/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Publish original-data ML evaluation and diagnostic plots"
            git push origin HEAD:main
          fi
