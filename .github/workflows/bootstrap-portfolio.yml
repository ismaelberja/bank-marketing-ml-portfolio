name: Bootstrap full ML portfolio

on:
  push:
    paths:
      - ".github/workflows/bootstrap-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout the newly created GitHub repository
        uses: actions/checkout@v4

      - name: Verify and extract the 21-file source package
        run: |
          set -euo pipefail
          cat staging/chunk-0[0-4].b64 staging/chunk-05-[0-7].b64 | base64 --decode > /tmp/portfolio.tar.xz
          echo "9670f30e229da95b1acb32e3bf56dc9f17d7ef192a2a3f73fe02175318023dac  /tmp/portfolio.tar.xz" | sha256sum --check
          tar -xJf /tmp/portfolio.tar.xz
          rm -rf staging
          # A GitHub Actions token is not permitted to change workflow files.
          # Keep this bootstrap workflow unchanged, and install the other
          # workflows through the separately authorized GitHub connection.
          rm .github/workflows/tests.yml .github/workflows/publish-results.yml
          test -f bankml/train.py
          test -f README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish full leakage-aware ML project and documentation'
          git push origin HEAD:main

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and run automated tests
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pytest -q

      - name: Download original UCI dataset
        run: python -m bankml.download

      - name: Fit and evaluate models on original data
        run: python -m bankml.train --data data/raw/bank-additional-full.csv --output reports/published

      - name: Publish real-data ML model metrics and plots
        run: |
          git add -f reports/published/RESULTS.md reports/published/experiment.json reports/published/figures/*.png
          git commit -m 'Publish verified UCI machine-learning results and charts'
          git push origin HEAD:main
